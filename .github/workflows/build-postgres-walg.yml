name: Build Postgres images with WAL-G

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: lordfre/postgres-walg
  WALG_VERSION: v3.0.9

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg_version:
          - '16'
          - '16-alpine'
          - '16-alpine2.23'
          - '16-alpine3.24'
          - '18'
          - '18-alpine'
          - '18-alpine3.23'
          - '18-alpine3.34'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (для сборки под arm64 и amd64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.pg_version }}
          build-args: |
            PG_VERSION=${{ matrix.pg_version }}
            WALG_VERSION=${{ env.WALG_VERSION }}
